[package]
name = "lugha"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Compiler for Lugha, a small statically typed language compiled through LLVM"
license-file = "LICENSE"
repository = "https://github.com/kithinjibrian/lugha"
# The VS Code extension (PRP-099) is Node, not part of the crate.
exclude = ["editors/"]

[[bin]]
name = "lughac"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
codespan-reporting = "0.13.1"
inkwell = { version = "0.10", features = ["llvm21-1-prefer-dynamic"] }
lsp-server = "0.10"
lsp-types = "0.97"
serde_json = "1"
thiserror = "2.0.21"
